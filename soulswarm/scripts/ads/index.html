<!doctype html><html><body><script>
const OrigAC = window.AudioContext;
window.AudioContext = class extends OrigAC { constructor(...a) { super(...a); window.__tap = this.createMediaStreamDestination(); } };
const oc = AudioNode.prototype.connect;
AudioNode.prototype.connect = function (d, ...r) { if (window.__tap && d === this.context.destination) oc.call(this, window.__tap, ...r); return oc.call(this, d, ...r); };
</script><script type="module">
import Audio from './audio.js';
window.__record = async (cues, ms) => {
  await Audio.init(); Audio.setVolumes({ music: 0.75, sfx: 0.85 });
  const rec = new MediaRecorder(window.__tap.stream, { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 192000 });
  const ch = []; rec.ondataavailable = (e) => ch.push(e.data); rec.start();
  for (const [t, k, n, v] of cues) setTimeout(() => k === 'music' ? Audio.playMusic(n) : Audio.sfx(n, { volume: v ?? 1 }), t);
  await new Promise((r) => setTimeout(r, ms)); rec.stop(); await new Promise((r) => (rec.onstop = r));
  const b = new Uint8Array(await new Blob(ch).arrayBuffer()); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
};
window.__ready = true;
</script></body></html>
