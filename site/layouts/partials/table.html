<div class="bg-off-white pv4" id="pricing">

	<div class="ph3 mw7 center">

		<h2 class="f2 b lh-title mb3">{{.heading}}</h2>
		<p class="mw6 mb4">{{.description}}</p>

		{{ $width := cond (eq (len .plans) 2) "w-50-ns" "w-33-ns" }}
		<div class="flex-ns mhn2-ns">
			{{ range .plans }}
			<div class="{{ $width }} ph2 mb4 mb0-ns">{{ partial "table-column" . }}</div>
			{{ end }}
		</div>

	</div>

</div>
