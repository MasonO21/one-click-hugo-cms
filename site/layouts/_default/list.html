{{ define "main" }}

{{ partial "jumbotron" (dict "imageUrl" "/img/journal-notebook.jpg" "title" "Trail journal") }}

<div class="mw7 center">
  <div class="flex-ns flex-wrap mhn1-ns pa3">
      {{ range (.Paginator 4).Pages.ByPublishDate.Reverse }}
          <div class="w-50-ns ph1-ns flex">
            {{ .Render "li"}}
          </div>
      {{ end }}
  </div>
  {{ partial "pagination" . }}
</div>

{{end}}
