<div id="app">
  <header id="hud">
    <div class="hud-row hud-top">
      <button class="power" data-act="tab" data-arg="heroes" aria-label="Your power">
        <svg class="ic"><use href="#i-power"/></svg><span id="hud-power">0</span>
      </button>
      <button class="wyrm-chip" data-act="plot" data-arg="wyrm" id="hud-wyrm"><b>Lv 1</b><span>Hatchling</span></button>
      <button class="cur" data-act="tab" data-arg="shop" aria-label="Starglass"><svg class="ic"><use href="#i-gem"/></svg><span id="hud-starglass">0</span><span class="plus">+</span></button>
      <button class="cur" data-act="tab" data-arg="recruit" aria-label="Beacon Tokens"><svg class="ic"><use href="#i-beacon"/></svg><span id="hud-beacons">0</span></button>
      <button class="icon-btn" data-act="settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
    <div class="hud-row res-row" id="hud-res"></div>
    <button class="hud-row climate" data-act="forecast" id="hud-climate" aria-label="Weather forecast"></button>
  </header>

  <main id="stage">
    <canvas id="town3d" aria-hidden="true"></canvas>
    <canvas id="town" aria-label="Your keep. Tap a building to manage it. Drag to move around, pinch or scroll to zoom, twist or right-drag to turn."></canvas>
    <div id="side"></div>
    <button id="camhome" class="cam-home" data-act="camhome" aria-label="Recenter the view" title="Recenter the view" hidden><svg class="ic"><use href="#i-compass"/></svg></button>
    <div id="queue"></div>
    <div id="quest"></div>
    <section id="world" hidden>
      <canvas id="world3d" aria-hidden="true"></canvas>
      <canvas id="worldmap" aria-label="The Dunes. Drag to look around, tap a tile to act."></canvas>
      <div id="world-ui"></div>
    </section>
    <section id="panel" hidden></section>
  </main>

  <nav id="tabs">
    <button data-act="tab" data-arg="town" class="tab"><svg class="ic"><use href="#i-town"/></svg><span>Keep</span></button>
    <button data-act="tab" data-arg="world" class="tab"><svg class="ic"><use href="#i-world"/></svg><span>World</span><i class="dot" id="dot-world" hidden></i></button>
    <button data-act="tab" data-arg="heroes" class="tab"><svg class="ic"><use href="#i-heroes"/></svg><span>Heroes</span><i class="dot" id="dot-heroes" hidden></i></button>
    <button data-act="tab" data-arg="caravan" class="tab"><svg class="ic"><use href="#i-caravan"/></svg><span>Caravan</span><i class="dot" id="dot-caravan" hidden></i></button>
    <button data-act="tab" data-arg="shop" class="tab"><svg class="ic"><use href="#i-shop"/></svg><span>Store</span><i class="dot" id="dot-shop" hidden></i></button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="scrim" hidden data-act="close"></div>
  <section id="sheet" hidden role="dialog" aria-modal="true"></section>
  <section id="battle" hidden></section>
</div>
