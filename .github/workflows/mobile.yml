name: Mobile app

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type-check, lint, and test
        run: npm run check
      - name: Bundle for Android and iOS
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/export-android"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/export-ios"
