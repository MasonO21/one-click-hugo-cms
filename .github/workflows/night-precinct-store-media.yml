# Night Precinct: uploads the App Store screenshots and the app preview video to the version page in
# App Store Connect, using the same API key secrets as the TestFlight upload.
# Actions > "Night Precinct store screenshots and video" > Run workflow:
#   check  = only look and report (changes nothing)
#   upload = upload whatever is missing (safe to run again; never deletes anything)
name: Night Precinct store screenshots and video

on:
  # A change to the script runs the read-only check automatically.
  push:
    paths: ['night-precinct/tools/asc_media.py', '.github/workflows/night-precinct-store-media.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = report only, upload = upload what is missing'
        type: choice
        options: [check, upload]
        default: check

permissions:
  contents: read

jobs:
  media:
    name: Store screenshots and video (${{ inputs.mode || 'check' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: night-precinct
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyjwt cryptography requests
      - run: python3 tools/asc_media.py ${{ inputs.mode || 'check' }}
