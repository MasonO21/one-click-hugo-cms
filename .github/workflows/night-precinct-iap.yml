# Night Precinct: creates the in-app purchases in App Store Connect from night-precinct/appstore/iap.json,
# with their review screenshots (night-precinct/appstore/iap-review/), using the same API key secrets as the
# TestFlight upload. Actions > "Night Precinct in-app purchases" > Run workflow:
#   check  = only look and report (changes nothing)
#   create = create whatever is missing (safe to run again; never deletes or changes existing products)
name: Night Precinct in-app purchases

on:
  # A change to the product list runs the read-only check automatically.
  push:
    paths: ['night-precinct/appstore/iap.json', 'night-precinct/tools/asc_iap.py', '.github/workflows/night-precinct-iap.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = report only, create = create what is missing'
        type: choice
        options: [check, create]
        default: check

permissions:
  contents: read

jobs:
  iap:
    name: In-app purchases (${{ inputs.mode || 'check' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: night-precinct
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyjwt cryptography requests
      - run: python3 tools/asc_iap.py ${{ inputs.mode || 'check' }}
