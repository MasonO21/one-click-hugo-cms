# Sizzle Flip on Android and iPhone, without owning either: GitHub's machines build the real app and run it on an
# Android emulator and an iPhone Simulator. That build includes a self-test (sizzle-flip/tools/device-smoke.js) that
# checks the native plugins (AdMob, store billing, storage), plays level 1 through the game's touch handlers and
# opens the shop. Screenshots and logs: Actions > the run > Artifacts. Also compiles the unsigned store builds.
# No accounts or secrets needed.
name: Sizzle Flip devices

on:
  push:
    paths: ['sizzle-flip/**', '.github/workflows/sizzle-flip-devices.yml']
  workflow_dispatch:

concurrency:
  group: sizzle-flip-devices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sizzle-flip

jobs:
  android:
    name: Android ${{ matrix.api }} emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sizzle-flip/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM (hardware acceleration for the emulator)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - name: Store build (release, unsigned) compiles
        if: matrix.api == 36
        run: |
          npm run cap:sync
          npm run release:check || echo "(release check lists what only the owner can fill in)"
          cd android && ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
      - name: Build the self-test app
        run: |
          node tools/build.mjs --smoke
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Run it on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: sizzle-flip
          script: bash tools/ci/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-screenshots-and-logs
          path: sizzle-flip/smoke-out
          if-no-files-found: ignore

  ios:
    name: iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sizzle-flip/package-lock.json
      - run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios
      - run: npm ci
      - name: Put the self-test app into the Xcode project (ios/, as committed)
        run: |
          node tools/build.mjs --smoke
          npx cap sync ios
      - name: Build for the Simulator (Debug)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/simulator.log" 2>&1 \
            || { grep -E "error:" -A4 "$RUNNER_TEMP/simulator.log" | head -120; tail -40 "$RUNNER_TEMP/simulator.log"; exit 1; }
          echo "Simulator build OK. Warnings: $(grep -c 'warning:' "$RUNNER_TEMP/simulator.log" || true)"
      - name: ffmpeg (turns the screen recording into screenshots)
        run: command -v ffmpeg || brew install ffmpeg
      - name: Run it on the iPhone Simulator
        run: bash tools/ci/ios-smoke.sh
      - name: Build for iPhone (Release, unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/device.log" 2>&1 \
            || { grep -E "error:" -A4 "$RUNNER_TEMP/device.log" | head -120; tail -40 "$RUNNER_TEMP/device.log"; exit 1; }
          echo "iPhone build OK."
      - name: Check the iPhone app bundle for what App Store Connect requires
        run: bash tools/ci/ios-bundle-check.sh build-device/Build/Products/Release-iphoneos/App.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-and-logs
          path: |
            sizzle-flip/smoke-out
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
