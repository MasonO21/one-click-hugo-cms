<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Waypath — trails that guide you</title>
    <meta name="description" content="Record a hike once. Every hiker after you gets arrows to follow, on Meta glasses or phone." />
    <meta name="theme-color" content="#1f7a4d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Waypath home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><use href="/icon.svg#mark"></use></svg>
        <span>Waypath</span>
      </a>
      <span id="glasses-chip" class="chip" hidden></span>
    </header>
    <main id="app" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="pad">Waypath needs JavaScript to run.</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
