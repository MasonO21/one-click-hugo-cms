# One-click deploy of the Sunup app (sunup/) on Render: render.com > New > Blueprint.
# A persistent disk keeps the data file across deploys (disks need a paid instance).
services:
  - type: web
    name: sunup
    runtime: node
    rootDir: sunup
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: sunup-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      # Optional: only for a custom domain. Otherwise the onrender.com address is used.
      - key: PUBLIC_URL
        sync: false
      # Optional: if unset, a key is generated once and kept on the disk.
      - key: SUNUP_DATA_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: APNS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: IOS_APP_ID
        sync: false
      - key: ANDROID_PACKAGE
        sync: false
      - key: ANDROID_CERT_SHA256
        sync: false
