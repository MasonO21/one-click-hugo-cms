<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nova Colony favicon: icon.svg reduced to bold shapes for 16-32 px (no filters, thicker outlines). -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b78"/>
      <stop offset="0.3" stop-color="#5d3a9c"/>
      <stop offset="0.55" stop-color="#d04f8e"/>
      <stop offset="0.78" stop-color="#ff8a5b"/>
      <stop offset="1" stop-color="#ffc56e"/>
    </linearGradient>
    <radialGradient id="p" cx="38" cy="27" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9f47c"/>
      <stop offset="0.32" stop-color="#63d06d"/>
      <stop offset="0.62" stop-color="#1fa07b"/>
      <stop offset="1" stop-color="#176f8d"/>
    </radialGradient>
    <clipPath id="pc"><circle cx="31" cy="42" r="18"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#s)"/>
  <path d="M0,-6.5 Q1.2,-1.2 6.5,0 Q1.2,1.2 0,6.5 Q-1.2,1.2 -6.5,0 Q-1.2,-1.2 0,-6.5Z" fill="#fff6d6" transform="translate(11 12)"/>
  <!-- dome (behind the planet, stands on its rim) -->
  <g transform="translate(26.2 22.6) rotate(-14)">
    <rect x="-10.2" y="-2.4" width="20.4" height="8.6" rx="2" fill="#dbe4ee" stroke="#14283a" stroke-width="2.2"/>
    <rect x="-9.2" y="1.2" width="18.4" height="2" fill="#ffb02e"/>
    <path d="M-8.2,-2.4 A8.2,8.2 0 0 1 8.2,-2.4 Z" fill="#aef0f8" stroke="#14283a" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <circle cx="31" cy="42" r="18" fill="url(#p)"/>
  <g clip-path="url(#pc)">
    <path d="M0,0 H64 V64 H0 Z M17,39.8 A18,18 0 1 0 53,39.8 A18,18 0 1 0 17,39.8 Z" fill="#4cecff" fill-rule="evenodd"/>
  </g>
  <!-- crashed pod in its crater -->
  <g transform="translate(40.6 25.6)">
    <ellipse cx="0" cy="0.4" rx="7.6" ry="2.4" fill="#e28d5b" transform="rotate(30)"/>
    <g transform="rotate(44) translate(0 -1.2)">
      <path d="M-4.6,0.4 L-4.6,-3.6 C-4.6,-8.8 -2.4,-12.8 0,-12.8 C2.4,-12.8 4.6,-8.8 4.6,-3.6 L4.6,0.4 Q4.6,2.2 2.8,2.2 L-2.8,2.2 Q-4.6,2.2 -4.6,0.4 Z" fill="#f1f5fa" stroke="#14283a" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="-3.6" y="-5.6" width="7.2" height="2.6" fill="#ffb02e"/>
      <circle cx="0" cy="-8.2" r="1.9" fill="#4fe6ff"/>
    </g>
  </g>
</svg>
