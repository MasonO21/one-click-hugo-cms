<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Nova Colony</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b2a3a; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 6vh); box-sizing: border-box; color: #fff; font: 800 clamp(28px, 6vmin, 56px) system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .02em; text-shadow: 0 3px 0 #7a3a1a, 0 6px 18px rgba(30, 10, 40, .55); background: #1b2a3a url(art/key/loading.webp) center / cover no-repeat; z-index: 100; transition: opacity .5s; }
      @media (orientation: portrait) { #boot { background-image: url(art/key/loading-portrait.webp); } }
      #boot small { margin-top: .6em; font: 700 clamp(13px, 2.4vmin, 18px) system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .9; text-shadow: 0 2px 6px rgba(30, 10, 40, .7); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot">Nova Colony<small>Landing…</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
