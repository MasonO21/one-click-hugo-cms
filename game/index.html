<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aether Rift: Warden Clash</title>
<style>
:root{--bg:#0b1020;--panel:#151c36;--panel2:#1d2750;--gold:#ffc83d;--gem:#47e0ff;--ok:#4be38a;--red:#ff5470;--txt:#eaf0ff;--mut:#8b97c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px 14px;overflow-y:auto}
.screen.on{display:flex}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.cur{background:var(--panel);padding:6px 12px;border-radius:20px;font-weight:700;font-size:14px}
.cur.g{color:var(--gold)}.cur.m{color:var(--gem)}
h1{margin:6px 0;font-size:34px;letter-spacing:1px;background:linear-gradient(90deg,#7df,#c7f,#fc4);-webkit-background-clip:text;color:transparent}
h2{margin:8px 0}
.sub{color:var(--mut);font-size:13px}
.btn{background:var(--panel2);border:2px solid #34428a;color:var(--txt);padding:12px 16px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(#ffb92e,#ff8a1f);border-color:#ffd37a;color:#2a1600;font-size:22px;padding:16px}
.btn.ad{background:linear-gradient(#2fbf71,#1c8f55);border-color:#7dffb4}
.btn.dis{opacity:.45;pointer-events:none}
.btn.sm{padding:8px 12px;font-size:13px}
.nav{display:flex;gap:8px;margin-top:auto;padding-top:12px}.nav .btn{flex:1;padding:12px 4px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border-radius:14px;padding:12px;border:2px solid #263063}
.card.sel{border-color:var(--gold)}
.card .nm{font-weight:800}.card .ds{font-size:12px;color:var(--mut);margin:4px 0 8px;min-height:30px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:8px;background:#2b3670}
.rar-c{color:#bcc}.rar-r{color:#6cf}.rar-e{color:#d7f}.rar-l{color:var(--gold)}
.hero-av{width:54px;height:54px;border-radius:50%;margin-bottom:6px;border:3px solid #fff3}
.bp{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.bpt{min-width:92px;background:var(--panel);border-radius:10px;padding:8px;text-align:center;font-size:12px}
.bpt.lock{opacity:.5}
.bar{height:12px;background:#0007;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gem),#a6f)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud .t{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000a;padding:6px 16px;border-radius:14px;font-weight:800}
#hud .pb{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;background:#000a;padding:6px 10px;border-radius:12px;font-size:13px;min-width:140px}
#stick{position:absolute;left:22px;bottom:30px;width:130px;height:130px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff5}
.sk{position:absolute;width:64px;height:64px;border-radius:50%;background:#2a3680;border:3px solid #9bf;color:#fff;font-weight:900;font-size:12px;pointer-events:auto;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:#000b}
#sk0{right:20px;bottom:30px;width:84px;height:84px;background:#a2331c;border-color:#ff9}
#sk1{right:120px;bottom:30px}#sk2{right:100px;bottom:105px}#sk3{right:20px;bottom:125px}
#mini{position:absolute;right:8px;top:max(8px,env(safe-area-inset-top));width:150px;height:62px;background:#000a;border-radius:8px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:18px;padding:20px;max-width:420px;width:100%;text-align:center;border:2px solid #34428a;max-height:90vh;overflow:auto}
.odds td{padding:2px 10px;font-size:12px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:14px;z-index:99;font-weight:700;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pb" id="pb"></div><div class="t" id="clock">0:00</div><canvas id="mini" width="300" height="124"></canvas>
  <div id="stick"><div id="knob"></div></div>
  <div class="sk" id="sk0">ATK</div><div class="sk" id="sk1"></div><div class="sk" id="sk2"></div><div class="sk" id="sk3"></div>
</div>

<div class="screen on" id="s-home"></div>
<div class="screen" id="s-heroes"></div>
<div class="screen" id="s-shop"></div>
<div class="screen" id="s-draw"></div>
<div class="screen" id="s-pass"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ====================== DATA ====================== */
const HEROES = {
  kael:  {n:'Kael, Ember Duelist', role:'Fighter', hp:1500, atk:62, rng:70,  spd:215, ranged:false, col:'#ff7a45', cost:0,
          sk:[{n:'Cinder Dash',t:'dash',cd:4,dmg:150},{n:'Flame Ring',t:'aoe',cd:7,dmg:170,r:150},{n:'Phoenix Fall',t:'aoe',cd:22,dmg:480,r:240,stun:1.2}]},
  lyra:  {n:'Lyra, Gale Archer', role:'Marksman', hp:1050, atk:78, rng:300, spd:210, ranged:true, col:'#5de08a', cost:3000,
          sk:[{n:'Wind Volley',t:'shot',cd:3.5,dmg:190},{n:'Tumble',t:'dash',cd:6,dmg:0},{n:'Storm Arrow',t:'shot',cd:20,dmg:520,w:30}]},
  morrow:{n:'Morrow, Void Mage', role:'Mage', hp:950, atk:70, rng:320, spd:205, ranged:true, col:'#b87bff', cost:4500,
          sk:[{n:'Rift Bolt',t:'shot',cd:3,dmg:210},{n:'Gravity Well',t:'aoe',cd:8,dmg:180,r:190,stun:.8},{n:'Collapse',t:'aoe',cd:24,dmg:620,r:280}]},
  brum:  {n:'Brum, Stone Warden', role:'Tank', hp:2300, atk:48, rng:70,  spd:195, ranged:false, col:'#8fa6c9', cost:6000,
          sk:[{n:'Shield Bash',t:'dash',cd:5,dmg:110,stun:.6},{n:'Bulwark',t:'shield',cd:9,amt:420},{n:'Quake',t:'aoe',cd:21,dmg:360,r:260,stun:1.5}]}
};
const SKINS = {
  nova:  {n:'Nova Aura',    rar:'r', col:'#6cf'},   frost:{n:'Frostbite',rar:'r', col:'#bff'},
  royal: {n:'Royal Crimson',rar:'e', col:'#f46'},   void: {n:'Voidwalker',rar:'e', col:'#a5f'},
  solar: {n:'Solar Ascendant (Legendary)',rar:'l',col:'#fd3'}
};
const ODDS = [['Legendary skin','l',2],['Epic skin','e',8],['Rare skin','r',30],['Coin bundle (1,000)','c',60]];
const PASS_LEVELS = 20, PASS_XP = 100;
const SHOP = [
  {id:'starter', n:'Starter Warden Pack', d:'Unlock Lyra + 600 gems + Nova Aura (one time)', price:'$1.99', once:true},
  {id:'gems1', n:'Handful of Gems', d:'300 gems', price:'$4.99', gems:300},
  {id:'gems2', n:'Pouch of Gems', d:'1,000 gems (+10% bonus)', price:'$14.99', gems:1000},
  {id:'gems3', n:'Chest of Gems', d:'2,200 gems (+25% bonus)', price:'$29.99', gems:2200},
  {id:'pass',  n:'Rift Pass Premium', d:'Unlocks premium track: gems, skins, coins', price:'$7.99', once:true}
];

/* ====================== SAVE ====================== */
const KEY='aetherRiftSave1';
let S = load();
function load(){ try{const j=JSON.parse(localStorage.getItem(KEY)); if(j) return j;}catch(e){}
  return {coins:1500,gems:300,owned:['kael'],skins:[],sel:'kael',skin:null,bpxp:0,free:[],prem:[],premium:false,pity:0,pity2:0,
          adsDay:'',adsUsed:0,daily:'',streak:0,bought:{},wins:0,played:0}; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
const today=()=>new Date().toISOString().slice(0,10);
if(S.adsDay!==today()){S.adsDay=today();S.adsUsed=0;}
const AD_CAP=6;

/* ====================== UI HELPERS ====================== */
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200);}
function modal(html){ $('mbox').innerHTML=html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $('s-'+id).classList.add('on'); render(id); }
function cur(){ return `<div class="top"><div class="cur g">🪙 ${S.coins.toLocaleString()}</div><div class="cur m">💎 ${S.gems.toLocaleString()}</div></div>`; }
function nav(){ return `<div class="nav"><button class="btn" onclick="show('home')">⚔️ Battle</button><button class="btn" onclick="show('heroes')">🛡 Wardens</button><button class="btn" onclick="show('draw')">✨ Draw</button><button class="btn" onclick="show('pass')">🎖 Pass</button><button class="btn" onclick="show('shop')">🛒 Shop</button></div>`; }
function heroAv(id,skin){ const c=skin&&SKINS[skin]?SKINS[skin].col:HEROES[id].col; return `<div class="hero-av" style="background:radial-gradient(circle at 35% 30%,#fff8,${c})"></div>`; }

/* Rewarded ad (placeholder: swap body for AdMob / AppLovin / Unity Ads SDK call). Daily cap keeps it fair. */
function adsLeft(){ return AD_CAP-S.adsUsed; }
function watchAd(label,onReward){
  if(adsLeft()<=0){toast('Daily ad limit reached — come back tomorrow!');return;}
  let n=5; modal(`<h2>📺 Ad playing…</h2><p class="sub">${label}</p><h1 id="adn">${n}</h1><p class="sub">Placeholder for a real rewarded-video SDK</p>`);
  const iv=setInterval(()=>{ n--; const e=$('adn'); if(e)e.textContent=n; if(n<=0){clearInterval(iv); closeModal(); S.adsUsed++; save(); onReward(); } },1000);
}
/* In-app purchase stub (replace with StoreKit 2 / Google Play Billing; verify receipts server-side). */
function buy(id){
  const p=SHOP.find(x=>x.id===id); if(p.once&&S.bought[id]){toast('Already owned');return;}
  if(!confirm(`[TEST MODE] Simulate purchase of ${p.n} for ${p.price}?`))return;
  if(p.gems) S.gems+=p.gems;
  if(id==='starter'){ if(!S.owned.includes('lyra'))S.owned.push('lyra'); S.gems+=600; if(!S.skins.includes('nova'))S.skins.push('nova'); }
  if(id==='pass') S.premium=true;
  if(p.once) S.bought[id]=1; save(); toast('Purchased: '+p.n); render('shop');
}

/* ====================== SCREENS ====================== */
function render(id){
  if(id==='home') renderHome(); if(id==='heroes') renderHeroes(); if(id==='shop') renderShop();
  if(id==='draw') renderDraw(); if(id==='pass') renderPass();
}
function renderHome(){
  const h=HEROES[S.sel], canDaily=S.daily!==today();
  $('s-home').innerHTML = cur() + `<h1>AETHER RIFT</h1><div class="sub">Warden Clash · 3v3 lane battles in ~4 minutes</div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
    <div style="transform:scale(1.8);margin:18px">${heroAv(S.sel,S.skin)}</div>
    <div><b>${h.n}</b> <span class="tag">${h.role}</span></div>
    <button class="btn pri" style="width:80%" onclick="startMatch()">PLAY</button>
    ${canDaily?`<button class="btn" onclick="claimDaily()">🎁 Daily Reward (day ${S.streak%7+1}/7)</button>`:''}
    <button class="btn ad sm ${adsLeft()<=0?'dis':''}" onclick="watchAd('Free gems',()=>{S.gems+=20;save();toast('+20 💎');renderHome()})">📺 Watch ad: +20 💎 (${adsLeft()} left today)</button>
    <div class="sub">Record: ${S.wins} wins / ${S.played} matches</div>
  </div>` + nav();
}
function claimDaily(){ S.streak++; const d=S.streak%7; const g=d===0?100:20, c=d===0?0:400; S.gems+=g; S.coins+=c+500; S.daily=today(); save(); toast(`Daily: +${c+500}🪙 +${g}💎`); renderHome(); }
function renderHeroes(){
  let h=cur()+'<h2>Wardens</h2><div class="grid">';
  for(const id in HEROES){ const x=HEROES[id], own=S.owned.includes(id);
    h+=`<div class="card ${S.sel===id?'sel':''}">${heroAv(id,S.sel===id?S.skin:null)}<div class="nm">${x.n}</div><div class="ds">${x.role} · HP ${x.hp} · ATK ${x.atk}<br>${x.sk.map(s=>s.n).join(' · ')}</div>
    ${own?`<button class="btn sm" onclick="S.sel='${id}';S.skin=null;save();renderHeroes()">${S.sel===id?'Selected':'Select'}</button>`
         :`<button class="btn sm" onclick="unlockHero('${id}')">🪙 ${x.cost.toLocaleString()}</button>`}</div>`; }
  h+='</div><h2>Skins</h2><div class="grid">';
  for(const id in SKINS){ const k=SKINS[id], own=S.skins.includes(id);
    h+=`<div class="card ${S.skin===id?'sel':''}"><div class="hero-av" style="background:radial-gradient(circle at 35% 30%,#fff8,${k.col})"></div><div class="nm rar-${k.rar}">${k.n}</div>
    ${own?`<button class="btn sm" onclick="S.skin=S.skin==='${id}'?null:'${id}';save();renderHeroes()">${S.skin===id?'Unequip':'Equip'}</button>`:'<div class="ds">Found in Aether Draw</div>'}</div>`; }
  $('s-heroes').innerHTML=h+'</div>'+nav();
}
function unlockHero(id){ const c=HEROES[id].cost; if(S.coins<c){toast('Not enough coins — win matches or watch ads!');return;} S.coins-=c; S.owned.push(id); save(); renderHeroes(); }
function renderShop(){
  let h=cur()+'<h2>Shop</h2><div class="sub">Spending is always optional. Everything except cosmetics can be earned by playing.</div><div class="grid" style="margin-top:10px">';
  for(const p of SHOP){ const own=p.once&&S.bought[p.id];
    h+=`<div class="card"><div class="nm">${p.n}</div><div class="ds">${p.d}</div><button class="btn sm ${own?'dis':''}" onclick="buy('${p.id}')">${own?'Owned':p.price}</button></div>`; }
  h+=`<div class="card"><div class="nm">Free Gem Chest</div><div class="ds">Watch a short ad (${adsLeft()}/${AD_CAP} left today)</div><button class="btn ad sm ${adsLeft()<=0?'dis':''}" onclick="watchAd('Free gem chest',()=>{const g=10+Math.floor(Math.random()*21);S.gems+=g;save();toast('+'+g+' 💎');renderShop()})">📺 Watch</button></div>`;
  $('s-shop').innerHTML=h+'</div>'+nav();
}
function renderDraw(){
  let odds='<table class="odds">'+ODDS.map(o=>`<tr><td class="rar-${o[1]}">${o[0]}</td><td>${o[2]}%</td></tr>`).join('')+'</table>';
  $('s-draw').innerHTML=cur()+`<h2>✨ Aether Draw</h2><div class="sub">Skins are cosmetic only — no gameplay power.</div>
  <div class="card" style="margin:12px 0;text-align:center">${odds}
  <div class="sub" style="margin:8px">Pity: guaranteed Epic+ within 10 draws (${10-S.pity} to go) · guaranteed Legendary within 50 (${50-S.pity2} to go)<br>Duplicates convert to coins.</div>
  <div class="row" style="justify-content:center"><button class="btn" onclick="draw(1)">💎 100 · x1</button><button class="btn" onclick="draw(10)">💎 900 · x10</button>
  <button class="btn ad sm ${adsLeft()<=0?'dis':''}" onclick="watchAd('Free draw',()=>draw(1,true))">📺 Free draw</button></div></div>`+nav();
}
function rollOne(){
  S.pity++; S.pity2++; let r=Math.random()*100, rar;
  if(S.pity2>=50) rar='l'; else if(S.pity>=10 && r>10) rar='e'; else rar=r<2?'l':r<10?'e':r<40?'r':'c';
  if(rar==='l'||rar==='e') S.pity=0; if(rar==='l') S.pity2=0; return rar;
}
function draw(n,free){
  const cost=n===1?100:900; if(!free){ if(S.gems<cost){toast('Not enough gems');show('shop');return;} S.gems-=cost; }
  let out='';
  for(let i=0;i<n;i++){ const rar=rollOne();
    if(rar==='c'){S.coins+=1000; out+=`<div class="rar-c">🪙 1,000 coins</div>`; continue;}
    const pool=Object.keys(SKINS).filter(k=>SKINS[k].rar===rar), id=pool[Math.floor(Math.random()*pool.length)];
    if(S.skins.includes(id)){S.coins+=rar==='l'?5000:rar==='e'?2000:800; out+=`<div class="rar-${rar}">${SKINS[id].n} (dup → coins)</div>`;}
    else{S.skins.push(id); out+=`<div class="rar-${rar}"><b>NEW! ${SKINS[id].n}</b></div>`;} }
  save(); modal(`<h2>Draw Results</h2>${out}<br><button class="btn" onclick="closeModal();renderDraw()">OK</button>`);
}
function renderPass(){
  const lvl=Math.min(PASS_LEVELS,Math.floor(S.bpxp/PASS_XP)), pct=(S.bpxp%PASS_XP)/PASS_XP*100;
  const rew=l=>({free:l%5===0?{g:50}:{c:500*(1+(l%3))}, prem:l%10===0?{skin:l===10?'royal':'solar'}:l%5===0?{g:120}:{g:30,c:600}});
  let h=cur()+`<h2>🎖 Rift Pass — Level ${lvl}/${PASS_LEVELS}</h2><div class="bar"><i style="width:${lvl>=PASS_LEVELS?100:pct}%"></i></div>
  <div class="sub" style="margin:6px 0">Earn pass XP from every match. ${S.premium?'Premium active ✔':'<button class="btn sm" onclick="buy(\'pass\')">Unlock Premium $7.99</button>'}</div>`;
  for(const track of ['free','prem']){
    h+=`<b>${track==='free'?'Free track':'Premium track'}</b><div class="bp">`;
    for(let l=1;l<=PASS_LEVELS;l++){ const r=rew(l)[track], got=S[track].includes(l), ok=l<=lvl&&(track==='free'||S.premium);
      const txt=r.skin?SKINS[r.skin].n:(r.c?`🪙${r.c} `:'')+(r.g?`💎${r.g}`:'');
      h+=`<div class="bpt ${ok?'':'lock'}">Lv ${l}<br>${txt}<br>${got?'✔':ok?`<button class="btn sm" onclick="claimPass('${track}',${l})">Claim</button>`:'🔒'}</div>`; }
    h+='</div>'; }
  $('s-pass').innerHTML=h+nav();
  window._rew=rew;
}
function claimPass(track,l){ const r=window._rew(l)[track]; if(r.c)S.coins+=r.c; if(r.g)S.gems+=r.g; if(r.skin&&!S.skins.includes(r.skin))S.skins.push(r.skin);
  S[track].push(l); save(); toast('Claimed!'); renderPass(); }
function addPassXp(x){ S.bpxp=Math.min(PASS_LEVELS*PASS_XP,S.bpxp+x); }

/* ====================== MATCH ====================== */
const cv=$('game'), cx=cv.getContext('2d'), mini=$('mini'), mx=mini.getContext('2d');
const WW=2400, WH=1000, LANES=[260,740], BASEY=500;
let G=null, joy={x:0,y:0}, keys={}, last=0, camX=0, camY=0, scale=1;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;scale=Math.max(.6,Math.min(1.1,innerHeight/620))*devicePixelRatio;}
addEventListener('resize',resize);

function mkHero(id,team,isPlayer,lane,skin){
  const d=HEROES[id]; return {k:'hero',id,team,isPlayer,lane,x:team?250:WW-250,y:BASEY+(lane?60:-60),hp:d.hp,max:d.hp,atk:d.atk,rng:d.rng,spd:d.spd,
    ranged:d.ranged,r:20,col:skin&&SKINS[skin]?SKINS[skin].col:d.col,cd:0,acd:[0,0,0],lvl:1,xp:0,stun:0,shield:0,dead:0,kills:0,deaths:0,wp:0,dir:{x:1,y:0},def:d,sk:d.sk};
}
function startMatch(){
  const mine=S.sel, others=Object.keys(HEROES).filter(k=>k!==mine);
  G={t:0,wave:6,ents:[],proj:[],fx:[],over:false,revived:false,kills:[0,0]};
  const E=G.ents, rnd=a=>a[Math.floor(Math.random()*a.length)];
  const p=mkHero(mine,0,true,0,S.skin); G.p=p; E.push(p);
  E.push(mkHero(rnd(others),0,false,1)); E.push(mkHero(rnd(Object.keys(HEROES)),0,false,0));
  for(let i=0;i<3;i++) E.push(mkHero(rnd(Object.keys(HEROES)),1,false,i%2));
  for(const team of [0,1]) for(let l=0;l<2;l++) for(const f of [.27,.45]){
    const x=team?WW*(1-f):WW*f; E.push({k:'tower',team,x,y:LANES[l],hp:1800,max:1800,r:30,cd:0,col:team?'#ff5470':'#47a8ff'}); }
  for(const team of [0,1]) E.push({k:'nexus',team,x:team?WW-130:130,y:BASEY,hp:4000,max:4000,r:55,cd:0,col:team?'#ff5470':'#47a8ff'});
  $('hud').style.display='block'; cv.style.display='block'; document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  ['sk1','sk2','sk3'].forEach((id,i)=>{const e=$(id);e.innerHTML=`${p.sk[i].n}<div class="cd" style="height:0"></div>`;});
  resize(); last=performance.now(); requestAnimationFrame(loop);
}
function spawnWave(){
  for(const team of [0,1]) for(let l=0;l<2;l++) for(let i=0;i<3;i++)
    G.ents.push({k:'minion',team,lane:l,x:team?WW-170-i*30:170+i*30,y:BASEY,hp:420+G.t*1.2,max:420+G.t*1.2,atk:28+G.t/20,rng:i===2?170:60,ranged:i===2,spd:95,r:12,cd:0,wp:0,stun:0,col:team?'#ff8aa0':'#8ad0ff'});
}
function wps(e){ const y=LANES[e.lane], t=e.team; const a=[[.2,y],[.8,y],[.93,BASEY]]; const pts=a.map(([f,yy])=>({x:WW*(t?1-f:f),y:yy})); return pts; }
function enemiesOf(e){ return G.ents.filter(o=>o.team!==e.team&&o.hp>0&&!o.dead); }
function pickTarget(e,range){
  let best=null,bd=1e9; for(const o of enemiesOf(e)){ const d=dist(e,o)-o.r; if(d>range)continue;
    let pr=d+(o.k==='hero'?-40:o.k==='minion'?0:120); if(pr<bd){bd=pr;best=o;} } return best; }
function dmgTo(t,d,src){
  if(t.shield>0){const a=Math.min(t.shield,d);t.shield-=a;d-=a;} t.hp-=d; G.fx.push({x:t.x,y:t.y-20,txt:Math.round(d),life:.6,col:t.team?'#ffd':'#f88'});
  if(t.hp<=0&&!t.dead){ kill(t,src); } }
function kill(t,src){
  if(t.k==='hero'){ t.dead=8+t.lvl*1.2; t.hp=0; t.deaths++; if(src&&src.k==='hero'){src.kills++;} G.kills[1-t.team]++; }
  else if(t.k==='nexus'){ endMatch(t.team===1); }
  if(src&&src.k==='hero'&&src.team!==t.team){ src.xp+=t.k==='hero'?120:t.k==='tower'?200:30; while(src.xp>=100*src.lvl&&src.lvl<10){src.xp-=100*src.lvl;src.lvl++;src.max*=1.08;src.hp+=src.max*.08;src.atk*=1.07;} }
  if(t.k==='minion') G.ents.splice(G.ents.indexOf(t),1);
}
function attack(e,t){
  const dmg=e.atk||e.dmg; if(e.ranged||e.k==='tower') G.proj.push({x:e.x,y:e.y,t,dmg,src:e,spd:520,col:e.col});
  else dmgTo(t,dmg,e); }
function useSkill(h,i,aim){
  const s=h.sk[i]; if(h.acd[i]>0||h.stun>0||h.dead)return false; h.acd[i]=s.cd;
  const dir=aim||h.dir, lvlm=1+h.lvl*.06;
  if(s.t==='dash'){ const hit=new Set(); for(let st=0;st<10;st++){h.x=Math.max(20,Math.min(WW-20,h.x+dir.x*22));h.y=Math.max(20,Math.min(WH-20,h.y+dir.y*22));
      for(const o of enemiesOf(h)) if(!hit.has(o)&&dist(h,o)<h.r+o.r+14){hit.add(o); if(s.dmg)dmgTo(o,s.dmg*lvlm,h); if(s.stun)o.stun=s.stun;} } }
  else if(s.t==='aoe'){ G.fx.push({x:h.x,y:h.y,ring:s.r,life:.4,col:h.col}); for(const o of enemiesOf(h)) if(dist(h,o)<s.r+o.r){dmgTo(o,s.dmg*lvlm,h); if(s.stun)o.stun=s.stun;} }
  else if(s.t==='shot'){ G.proj.push({x:h.x,y:h.y,vx:dir.x*700,vy:dir.y*700,dmg:s.dmg*lvlm,src:h,life:.9,pierce:true,w:s.w||18,col:h.col,hit:new Set()}); }
  else if(s.t==='shield'){ h.shield=s.amt*lvlm; G.fx.push({x:h.x,y:h.y,ring:50,life:.6,col:'#9cf'}); }
  return true;
}
function aimAt(h){ const t=pickTarget(h,h.rng+260); if(t){const d=Math.hypot(t.x-h.x,t.y-h.y)||1;return{x:(t.x-h.x)/d,y:(t.y-h.y)/d};} return h.dir; }

function moveToward(e,tx,ty,dt,sp){ const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy); if(d<4)return; e.x+=dx/d*sp*dt; e.y+=dy/d*sp*dt; e.dir={x:dx/d,y:dy/d}; }
function update(dt){
  G.t+=dt; G.wave-=dt; if(G.wave<=0){spawnWave();G.wave=14;}
  for(const e of G.ents.slice()){
    if(e.hp<=0&&e.k!=='hero')continue;
    if(e.cd>0)e.cd-=dt; if(e.stun>0){e.stun-=dt;continue;}
    if(e.k==='hero'){
      for(let i=0;i<3;i++) if(e.acd[i]>0)e.acd[i]-=dt;
      if(e.dead>0){ e.dead-=dt; if(e.dead<=0){e.dead=0;e.hp=e.max;const bx=e.team?WW-250:250;e.x=bx;e.y=BASEY;e.wp=0;} continue; }
      e.hp=Math.min(e.max,e.hp+4*dt);
      if(e.isPlayer){
        let mx_=joy.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0), my_=joy.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
        const m=Math.hypot(mx_,my_); if(m>.1){ const k=Math.min(1,m)/m; e.x+=mx_*k*e.spd*dt; e.y+=my_*k*e.spd*dt; e.dir={x:mx_/m,y:my_/m}; }
        e.x=Math.max(20,Math.min(WW-20,e.x)); e.y=Math.max(20,Math.min(WH-20,e.y));
        const t=pickTarget(e,e.rng); if(t&&e.cd<=0&&(e.autoAtk||keys[' ']||G.atkHeld||true)){ attack(e,t); e.cd=.75; }
      } else {
        const t=pickTarget(e,e.rng), lowhp=e.hp<e.max*.3;
        if(lowhp){ moveToward(e,e.team?WW-200:200,BASEY,dt,e.spd*1.1); }
        else if(t){ if(dist(e,t)>e.rng+t.r-10) moveToward(e,t.x,t.y,dt,e.spd*.9);
          if(e.cd<=0){attack(e,t);e.cd=.8;} for(let i=2;i>=0;i--) if(e.acd[i]<=0&&Math.random()<dt*.8&&(e.sk[i].t!=='dash')&&dist(e,t)<(e.sk[i].r||350)){useSkill(e,i,aimAt(e));break;} }
        else { const p=wps(e)[Math.min(e.wp,2)]; if(dist(e,p)<30)e.wp=Math.min(2,e.wp+1); moveToward(e,p.x,p.y,dt,e.spd); }
      }
    } else if(e.k==='minion'){
      const t=pickTarget(e,e.rng);
      if(t){ if(e.cd<=0){attack(e,t);e.cd=1;} }
      else { const p=wps(e)[Math.min(e.wp,2)]; if(dist(e,p)<30)e.wp=Math.min(2,e.wp+1); moveToward(e,p.x,p.y,dt,e.spd); }
    } else { // tower / nexus
      const t=pickTarget(e,e.k==='tower'?280:230); if(t&&e.cd<=0){ G.proj.push({x:e.x,y:e.y,t,dmg:e.k==='tower'?70:90,src:e,spd:600,col:e.col}); e.cd=1; } }
  }
  for(const p of G.proj.slice()){
    if(p.t){ if(p.t.hp<=0||p.t.dead){G.proj.splice(G.proj.indexOf(p),1);continue;} const dx=p.t.x-p.x,dy=p.t.y-p.y,d=Math.hypot(dx,dy);
      if(d<14){dmgTo(p.t,p.dmg,p.src);G.proj.splice(G.proj.indexOf(p),1);} else{p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;} }
    else { p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      for(const o of enemiesOf(p.src)) if(!p.hit.has(o)&&dist(p,o)<o.r+p.w){p.hit.add(o);dmgTo(o,p.dmg,p.src);}
      if(p.life<=0)G.proj.splice(G.proj.indexOf(p),1); } }
  for(const f of G.fx)f.life-=dt; G.fx=G.fx.filter(f=>f.life>0);
  G.ents=G.ents.filter(e=>e.k==='hero'||e.hp>0||e.k==='nexus');
  // skill button cooldown UI
  for(let i=0;i<3;i++){const c=document.querySelector('#sk'+(i+1)+' .cd'); if(c)c.style.height=Math.max(0,G.p.acd[i]/G.p.sk[i].cd*100)+'%';}
  const m=Math.floor(G.t/60),s=Math.floor(G.t%60); $('clock').textContent=`${m}:${String(s).padStart(2,'0')}`;
  $('pb').innerHTML=`Lv ${G.p.lvl} · K/D ${G.p.kills}/${G.p.deaths}<br>Team ${G.kills[0]} – ${G.kills[1]}${G.p.dead?` · respawn ${Math.ceil(G.p.dead)}s`:''}`;
  if(G.t>300&&!G.over){ const a=G.ents.find(e=>e.k==='nexus'&&e.team===0),b=G.ents.find(e=>e.k==='nexus'&&e.team===1); endMatch(b.hp<a.hp); }
}
function endMatch(win){
  if(G.over)return; G.over=true; S.played++; if(win)S.wins++;
  const coins=(win?600:250)+G.p.kills*30, gems=win?10:3, xp=win?60:35;
  const pend={coins,gems,xp}; G.pend=pend;
  setTimeout(()=>{ $('hud').style.display='none'; cv.style.display='none';
    modal(`<h1>${win?'VICTORY':'DEFEAT'}</h1><p>K/D ${G.p.kills}/${G.p.deaths}</p><p>🪙 ${coins} · 💎 ${gems} · 🎖 ${xp} pass XP</p>
    <div class="row" style="justify-content:center"><button class="btn ad ${adsLeft()<=0?'dis':''}" id="dbl">📺 Watch ad: 2× rewards</button><button class="btn" id="cl">Continue</button></div>`);
    const fin=m=>{S.coins+=coins*m;S.gems+=gems*m;addPassXp(xp*m);save();closeModal();show('home');};
    $('dbl').onclick=()=>watchAd('Double rewards',()=>fin(2)); $('cl').onclick=()=>fin(1); },900);
}

/* ====================== RENDER MATCH ====================== */
function draw_(){
  const p=G.p, W=cv.width, H=cv.height; camX=Math.max(0,Math.min(WW-W/scale,p.x-W/scale/2)); camY=Math.max(0,Math.min(WH-H/scale,p.y-H/scale/2));
  cx.setTransform(1,0,0,1,0,0); cx.fillStyle='#10301f'; cx.fillRect(0,0,W,H);
  cx.setTransform(scale,0,0,scale,-camX*scale,-camY*scale);
  cx.fillStyle='#173f2a'; cx.fillRect(0,0,WW,WH);
  cx.fillStyle='#3a3a52'; for(const y of LANES) cx.fillRect(0,y-60,WW,120);
  cx.fillStyle='#1f2c60'; cx.fillRect(0,BASEY-140,320,280); cx.fillStyle='#5a1f2c'; cx.fillRect(WW-320,BASEY-140,320,280);
  cx.fillStyle='#2a6f8a55'; cx.fillRect(WW/2-120,BASEY-90,240,180); // river
  for(const e of G.ents.slice().sort((a,b)=>a.y-b.y)){
    if(e.dead)continue; cx.fillStyle=e.col;
    if(e.k==='tower'){cx.fillRect(e.x-18,e.y-34,36,50);cx.fillStyle='#fff6';cx.fillRect(e.x-10,e.y-44,20,12);}
    else if(e.k==='nexus'){cx.beginPath();cx.arc(e.x,e.y,e.r,0,7);cx.fill();cx.fillStyle='#fff7';cx.beginPath();cx.arc(e.x,e.y,e.r*.5,0,7);cx.fill();}
    else{ cx.beginPath();cx.arc(e.x,e.y,e.r,0,7);cx.fill(); cx.lineWidth=3; cx.strokeStyle=e.team?'#ff5470':'#47a8ff'; cx.stroke(); if(e.isPlayer){cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.arc(e.x,e.y,e.r+6,0,7);cx.stroke();}
      if(e.shield>0){cx.strokeStyle='#9cf';cx.beginPath();cx.arc(e.x,e.y,e.r+4,0,7);cx.stroke();} if(e.stun>0){cx.fillStyle='#fff';cx.fillText('✦',e.x-5,e.y-e.r-14);} }
    const w=e.k==='minion'?26:e.k==='hero'?46:60, y0=e.y-e.r-(e.k==='tower'?36:10);
    cx.fillStyle='#000a'; cx.fillRect(e.x-w/2,y0,w,5); cx.fillStyle=e.team?'#ff5470':'#3cf'; cx.fillRect(e.x-w/2,y0,w*Math.max(0,e.hp)/e.max,5); }
  for(const q of G.proj){cx.fillStyle=q.col;cx.beginPath();cx.arc(q.x,q.y,q.w?q.w*.6:5,0,7);cx.fill();}
  cx.font='bold 14px sans-serif';
  for(const f of G.fx){ if(f.ring){cx.strokeStyle=f.col;cx.lineWidth=4;cx.globalAlpha=f.life*2;cx.beginPath();cx.arc(f.x,f.y,f.ring*(1-f.life),0,7);cx.stroke();cx.globalAlpha=1;} else {cx.fillStyle=f.col;cx.fillText(f.txt,f.x,f.y-(.6-f.life)*40);} }
  // minimap
  mx.clearRect(0,0,300,124); const k=300/WW; for(const e of G.ents){ if(e.dead)continue; mx.fillStyle=e.isPlayer?'#fff':e.team?'#ff5470':'#47a8ff'; const s=e.k==='nexus'?7:e.k==='tower'?5:e.k==='hero'?5:2; mx.fillRect(e.x*k-s/2,e.y*k-s/2,s,s); }
}
function loop(now){ if(!G||G.over&&!G.ents)return; const dt=Math.min(.05,(now-last)/1000); last=now; if(!G.over)update(dt); draw_(); if(cv.style.display==='block')requestAnimationFrame(loop); }

/* ====================== INPUT ====================== */
const stick=$('stick'), knob=$('knob'); let sid=null;
function stickMove(t){ const r=stick.getBoundingClientRect(), cx0=r.left+r.width/2, cy0=r.top+r.height/2; let dx=t.clientX-cx0, dy=t.clientY-cy0; const d=Math.hypot(dx,dy), m=65; if(d>m){dx*=m/d;dy*=m/d;} joy.x=dx/m; joy.y=dy/m; knob.style.transform=`translate(${dx}px,${dy}px)`; }
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)stickMove(e);});
const rel=e=>{if(e.pointerId===sid){sid=null;joy={x:0,y:0};knob.style.transform='';}}; stick.addEventListener('pointerup',rel); stick.addEventListener('pointercancel',rel);
['sk1','sk2','sk3'].forEach((id,i)=>$(id).addEventListener('pointerdown',e=>{if(G&&!G.over)useSkill(G.p,i,aimAt(G.p));e.preventDefault();}));
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; keys[e.key]=true; if(G&&!G.over){ if(e.key==='j')useSkill(G.p,0,aimAt(G.p)); if(e.key==='k')useSkill(G.p,1,aimAt(G.p)); if(e.key==='l')useSkill(G.p,2,aimAt(G.p)); }});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false; keys[e.key]=false;});

render('home');
</script>
