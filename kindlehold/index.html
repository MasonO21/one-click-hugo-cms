<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Kindlehold</title>
<meta name="description" content="Kindlehold: raise the last living flame and keep your people alive through the long winter.">
<meta name="theme-color" content="#0c1420">
<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>

    <symbol id="i-people" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="7.5" r="3.3"/><path d="M2.5 20.5c0-3.9 2.9-6.6 6.5-6.6s6.5 2.7 6.5 6.6z"/><circle cx="17.2" cy="8.6" r="2.6"/><path d="M15.3 14.2c3.5-.9 6.7 1.6 6.7 6.3h-4.6c0-2.6-.8-4.7-2.1-6.3z"/></g></symbol>

<div id="app">
  <header id="hud">
    <div class="hud-row hud-top">
      <button class="power" data-act="tab" data-arg="heroes" aria-label="Your power">
        <svg class="ic"><use href="#i-power"/></svg><span id="hud-power">0</span>
      </button>
      <button class="wyrm-chip" data-act="plot" data-arg="hearth" id="hud-wyrm"><b>Lv 1</b><span>Hatchling</span></button>
      <button class="cur" data-act="tab" data-arg="shop" aria-label="Starglass"><svg class="ic"><use href="#i-gem"/></svg><span id="hud-starglass">0</span><span class="plus">+</span></button>
      <button class="cur" data-act="tab" data-arg="recruit" aria-label="Beacon Tokens"><svg class="ic"><use href="#i-beacon"/></svg><span id="hud-beacons">0</span></button>
      <button class="icon-btn" data-act="settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
    <div class="hud-row res-row" id="hud-res"></div>
    <button class="hud-row climate" data-act="forecast" id="hud-climate" aria-label="Weather forecast"></button>
  </header>

  <main id="stage">
    <canvas id="town" aria-label="Your hold. Tap a building to manage it."></canvas>
    <div id="queue"></div>
    <div id="quest"></div>
    <section id="panel" hidden></section>
  </main>

  <nav id="tabs">
    <button data-act="tab" data-arg="town" class="tab"><svg class="ic"><use href="#i-town"/></svg><span>Hold</span></button>
    <button data-act="tab" data-arg="heroes" class="tab"><svg class="ic"><use href="#i-heroes"/></svg><span>Heroes</span></button>
    <button data-act="tab" data-arg="expedition" class="tab"><svg class="ic"><use href="#i-map"/></svg><span>Expedition</span><i class="dot" id="dot-exp" hidden></i></button>
    <button data-act="tab" data-arg="recruit" class="tab"><svg class="ic"><use href="#i-recruit"/></svg><span>Beacon</span><i class="dot" id="dot-rec" hidden></i></button>
    <button data-act="tab" data-arg="shop" class="tab"><svg class="ic"><use href="#i-shop"/></svg><span>Store</span><i class="dot" id="dot-shop" hidden></i></button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="scrim" hidden data-act="close"></div>
  <section id="sheet" hidden role="dialog" aria-modal="true"></section>
  <section id="battle" hidden></section>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
